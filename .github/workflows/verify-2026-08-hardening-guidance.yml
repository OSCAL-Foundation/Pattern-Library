name: verify 2026-08 hardening guidance analysis

# Every claim on that analysis site is meant to be derivable from a published
# file. This workflow is what keeps that true after the build session that wrote
# it.
#
# It runs in two passes, and the split is the point:
#
#   1. offline    the harness uses --offline: after dependencies and sources
#                 are acquired, verification does not access the network.
#   2. strict     --all --strict counts every skipped check as a failure,
#                 including schema, external-link and browser checks.
#
# Both passes run corpus-independent regression checks before requiring a
# readable source repository and a full commit SHA in repository variables.
# Missing configuration or source files fails the job; it never skips sources.
#
# Without the second pass a skipped check stays skipped forever, and the harness
# quietly stops covering the thing it was written to cover.
#
# The repository is checked out under site/ so the corpora can sit beside it
# rather than inside it: the byte-identical check below runs `git diff`, and a
# 231-file corpus inside the working tree would be untracked noise in it.

on:
  push:
    paths:
      - "docs/analysis/2026-08-automating-technical-hardening-guidance/**"
      - ".github/workflows/verify-2026-08-hardening-guidance.yml"
  pull_request:
    paths:
      - "docs/analysis/2026-08-automating-technical-hardening-guidance/**"
      - ".github/workflows/verify-2026-08-hardening-guidance.yml"
  workflow_dispatch:
  schedule:
    # The NIST schema and the external links can change without anyone touching
    # this repository, so the strict pass also runs weekly. A schedule ignores
    # the paths filter above, which is what that is for.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  SITE: site/docs/analysis/2026-08-automating-technical-hardening-guidance
  TFG_CORPORA: ${{ github.workspace }}/tfg-automated-assessments
  TFG_CORPORA_REPOSITORY: ${{ vars.TFG_CORPORA_REPOSITORY }}
  TFG_CORPORA_REF: ${{ vars.TFG_CORPORA_REF }}

jobs:
  offline:
    name: offline, what a contributor can reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: site

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Pillow is not optional: verify.py imports svgrender, which imports PIL
      # at module scope, so the harness will not start without it.
      - name: Install the harness dependencies
        run: pip install pyyaml pillow 'jsonschema[format]' regex

      # svgrender loads DejaVu by absolute path rather than through fontconfig.
      - name: Install the fonts the rasteriser names
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Run banner regression checks
        working-directory: ${{ env.SITE }}
        run: node tools/bannercheck.js

      - name: Run verifier unit tests
        working-directory: ${{ env.SITE }}
        run: |
          [[ -f tools/test_verify.py ]] || { echo "::error::Missing tools/test_verify.py regression tests"; exit 1; }
          python -m unittest discover -s tools -p test_verify.py -v

      - name: Run corpus-independent structural checks without network
        working-directory: ${{ env.SITE }}
        # --example invokes the corpus-backed artifact generator. Keep it in
        # the full --all pass below, not in this independent subset.
        run: python tools/verify.py --data --css --quotes --bundle --source --pages --offline

      - name: Require a configured source repository and commit pin
        shell: bash
        run: |
          status=0
          if [[ ! "$TFG_CORPORA_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Source gate: set repository variable TFG_CORPORA_REPOSITORY to owner/repository for an authorized full corpus readable with github.token. No default source repository exists."
            status=1
          fi
          if [[ ! "$TFG_CORPORA_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Source gate: set repository variable TFG_CORPORA_REF to a full 40-character commit SHA; branches and tags are not accepted."
            status=1
          fi
          exit "$status"

      - name: Check out the pinned source corpora
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TFG_CORPORA_REPOSITORY }}
          ref: ${{ env.TFG_CORPORA_REF }}
          path: tfg-automated-assessments
          token: ${{ github.token }}
          persist-credentials: false

      - name: Require the pinned commit and nonempty source files
        working-directory: ${{ env.SITE }}
        shell: bash
        run: |
          [[ "$(git -C "$TFG_CORPORA" rev-parse HEAD)" == "${TFG_CORPORA_REF,,}" ]] || {
            echo "::error::Source gate: checked-out commit does not match TFG_CORPORA_REF."
            exit 1
          }
          # A directory containing only .git is not a corpus. Check every
          # manifest source; --all below verifies the rest of the corpus too.
          python - <<'PY'
          import os
          from pathlib import Path
          import sys
          import yaml

          root = Path(os.environ["TFG_CORPORA"])
          manifest = yaml.safe_load(Path("tools/manifest.yaml").read_text(encoding="utf-8"))
          required = {entry["source"] for entry in manifest["snippets"]}
          required.update({"Hardening-Guidance-Options-Comparison.docx",
                           "Technology_Specific_Hardening_Guidance_in_OSCAL.docx"})
          if not required:
              sys.exit("::error::Source gate: the snippet manifest declares no source files.")
          missing = sorted(rel for rel in required
                           if not (root / rel).is_file() or (root / rel).stat().st_size == 0)
          for rel in missing:
              print(f"::error::Source gate: missing or empty corpus file: {rel}")
          if missing:
              sys.exit(1)
          print(f"Source gate: {len(required)} required files present at the pinned commit.")
          PY

      - name: Re-extract every snippet and diff
        working-directory: ${{ env.SITE }}
        run: python tools/verify.py --snippets --offline

      - name: Run every offline check
        working-directory: ${{ env.SITE }}
        run: python tools/verify.py --all --offline

      - name: Confirm the generated files are byte-identical to their generators
        working-directory: ${{ env.SITE }}
        run: |
          # A generated file that has been hand-edited is the one failure this
          # repository cannot detect by reading. Regenerate and diff.
          python tools/extract.py
          python tools/pattern_examples.py
          python tools/oscal_artifacts.py
          python tools/sources_files.py
          python tools/diagrams.py
          python tools/approach_pages.py
          python tools/scenario_page.py
          python tools/bundle.py
          git diff --exit-code -- data assets/diagrams assets/bundle.js \
            assessment-first.html catalog-first.html component-first.html \
            scenario.html \
            || { echo "::error::a generated file differs from its generator."\
                 "Run the generators and commit the result."; exit 1; }

  strict:
    name: strict, the checks that need network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: site

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the harness dependencies
        # regex supports the Unicode patterns used by the NIST schemas.
        run: pip install pyyaml pillow 'jsonschema[format]' regex

      - name: Install the fonts the rasteriser names
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Run banner regression checks
        working-directory: ${{ env.SITE }}
        run: node tools/bannercheck.js

      - name: Run verifier unit tests
        working-directory: ${{ env.SITE }}
        run: |
          [[ -f tools/test_verify.py ]] || { echo "::error::Missing tools/test_verify.py regression tests"; exit 1; }
          python -m unittest discover -s tools -p test_verify.py -v

      - name: Run corpus-independent structural checks without network
        working-directory: ${{ env.SITE }}
        run: python tools/verify.py --data --css --quotes --bundle --source --pages --offline

      - name: Require a configured source repository and commit pin
        shell: bash
        run: |
          status=0
          if [[ ! "$TFG_CORPORA_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Source gate: set repository variable TFG_CORPORA_REPOSITORY to owner/repository for an authorized full corpus readable with github.token. No default source repository exists."
            status=1
          fi
          if [[ ! "$TFG_CORPORA_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Source gate: set repository variable TFG_CORPORA_REF to a full 40-character commit SHA; branches and tags are not accepted."
            status=1
          fi
          exit "$status"

      - name: Check out the pinned source corpora
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TFG_CORPORA_REPOSITORY }}
          ref: ${{ env.TFG_CORPORA_REF }}
          path: tfg-automated-assessments
          token: ${{ github.token }}
          persist-credentials: false

      - name: Require the pinned commit and nonempty source files
        working-directory: ${{ env.SITE }}
        shell: bash
        run: |
          [[ "$(git -C "$TFG_CORPORA" rev-parse HEAD)" == "${TFG_CORPORA_REF,,}" ]] || {
            echo "::error::Source gate: checked-out commit does not match TFG_CORPORA_REF."
            exit 1
          }
          python - <<'PY'
          import os
          from pathlib import Path
          import sys
          import yaml

          root = Path(os.environ["TFG_CORPORA"])
          manifest = yaml.safe_load(Path("tools/manifest.yaml").read_text(encoding="utf-8"))
          required = {entry["source"] for entry in manifest["snippets"]}
          required.update({"Hardening-Guidance-Options-Comparison.docx",
                           "Technology_Specific_Hardening_Guidance_in_OSCAL.docx"})
          if not required:
              sys.exit("::error::Source gate: the snippet manifest declares no source files.")
          missing = sorted(rel for rel in required
                           if not (root / rel).is_file() or (root / rel).stat().st_size == 0)
          for rel in missing:
              print(f"::error::Source gate: missing or empty corpus file: {rel}")
          if missing:
              sys.exit(1)
          print(f"Source gate: {len(required)} required files present at the pinned commit.")
          PY

      - name: Install axe-core and a headless browser
        working-directory: ${{ env.SITE }}
        run: npm install --no-save axe-core puppeteer

      - name: Every check, with a skip counted as a failure
        working-directory: ${{ env.SITE }}
        run: python tools/verify.py --all --strict

      - name: Publish the accessibility report
        if: always()
        working-directory: ${{ env.SITE }}
        run: node tools/axe_run.mjs || true

  pages-build:
    name: the site serves and opens from a folder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: site

      - name: The publication requirements that are not checks
        working-directory: ${{ env.SITE }}
        run: |
          set -e
          test -f .nojekyll || { echo "::error::.nojekyll is missing, so Pages"\
            "would run Jekyll over the site and drop assets/"; exit 1; }
          # An absolute path works on one of Pages and a folder, never both.
          # This is what holds the site relocatable now that it is nested.
          if grep -rn 'href="/\|src="/' --include='*.html' .; then
            echo "::error::an absolute path was found. Every path must be relative."
            exit 1
          fi
          for f in *.html; do
            grep -q 'og:title' "$f" || { echo "::error::$f has no Open Graph title"; exit 1; }
            grep -q 'twitter:card' "$f" || { echo "::error::$f has no Twitter card"; exit 1; }
          done
          echo "every page carries its metadata"
