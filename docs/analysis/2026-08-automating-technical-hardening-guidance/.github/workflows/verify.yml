name: verify

# Every claim on this site is meant to be derivable from a published file. This
# workflow is what keeps that true after the build session that wrote it.
#
# It runs in two passes, and the split is the point:
#
#   1. offline    exactly what a contributor can run on a laptop with no
#                 network. If this fails, the failure is reproducible locally.
#   2. strict     the same harness with --strict, which turns every skipped
#                 check into a failure. The runner has network and can install
#                 an OSCAL validator and a headless browser, so the four checks
#                 that skip locally have to pass here.
#
# Without the second pass a skipped check stays skipped forever, and the harness
# quietly stops covering the thing it was written to cover.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # The NIST schema and the external links can change without anyone touching
    # this repository, so the strict pass also runs weekly.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  offline:
    name: offline, what a contributor can reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The corpora live beside this repository, one directory up. Without
          # them --snippets and --stats have nothing to read.
          path: site

      - name: Check out the source corpora
        uses: actions/checkout@v4
        with:
          repository: OSCAL-Foundation/tfg-automated-assessments
          path: tfg-automated-assessments
        continue-on-error: true
        id: corpora

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Report whether the corpora are present
        working-directory: site
        run: |
          if [ -d ../tfg-automated-assessments ]; then
            echo "corpora present, every check can run"
          else
            echo "::warning::the corpora are not available to this runner, so"\
                 "--snippets, --stats and --conformance cannot read them"
          fi

      - name: Re-extract every snippet and diff
        working-directory: site
        run: python tools/verify.py --snippets

      - name: Run every offline check
        working-directory: site
        run: python tools/verify.py --all

      - name: Render each page and inspect the result
        working-directory: site
        run: node tools/pagecheck.js

      - name: Confirm the generated files are byte-identical to their generators
        working-directory: site
        run: |
          # A generated file that has been hand-edited is the one failure this
          # repository cannot detect by reading. Regenerate and diff.
          python tools/extract.py
          python tools/pattern_examples.py
          python tools/oscal_artifacts.py
          python tools/sources_files.py
          python tools/diagrams.py
          python tools/approach_pages.py
          python tools/scenario_page.py
          python tools/bundle.py
          git diff --exit-code -- data assets/diagrams \
            assessment-first.html catalog-first.html component-first.html \
            scenario.html \
            || { echo "::error::a generated file differs from its generator."\
                 "Run the generators and commit the result."; exit 1; }

  strict:
    name: strict, the checks that need network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: site

      - uses: actions/checkout@v4
        with:
          repository: OSCAL-Foundation/tfg-automated-assessments
          path: tfg-automated-assessments
        continue-on-error: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the harness dependencies
        run: pip install pyyaml

      - name: Install an OSCAL validator
        # compliance-trestle carries its own copy of the OSCAL schemas and
        # validates a file against the model its root element names, which is
        # what --conformance needs.
        run: pip install compliance-trestle

      - name: Install axe-core and a headless browser
        working-directory: site
        run: npm install --no-save axe-core puppeteer

      - name: Every check, with a skip counted as a failure
        working-directory: site
        run: python tools/verify.py --all --strict

      - name: Publish the accessibility report
        if: always()
        working-directory: site
        run: node tools/axe_run.mjs || true

  pages-build:
    name: the site serves and opens from a folder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The publication requirements that are not checks
        run: |
          set -e
          test -f .nojekyll || { echo "::error::.nojekyll is missing, so Pages"\
            "would run Jekyll over the site and drop assets/"; exit 1; }
          # An absolute path works on one of Pages and a folder, never both.
          if grep -rn 'href="/\|src="/' --include='*.html' .; then
            echo "::error::an absolute path was found. Every path must be relative."
            exit 1
          fi
          for f in *.html; do
            grep -q 'og:title' "$f" || { echo "::error::$f has no Open Graph title"; exit 1; }
            grep -q 'twitter:card' "$f" || { echo "::error::$f has no Twitter card"; exit 1; }
          done
          echo "every page carries its metadata"
