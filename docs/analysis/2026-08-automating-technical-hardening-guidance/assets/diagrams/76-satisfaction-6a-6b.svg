<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 830" id="dg-76-satisfaction-6a-6b" class="tfg-diagram" role="img" aria-labelledby="dg-76-satisfaction-6a-6b-t dg-76-satisfaction-6a-6b-d" preserveAspectRatio="xMidYMid meet">
  <title id="dg-76-satisfaction-6a-6b-t">One rule, two satisfaction assertions: the implementation claim and the assessment result</title>
  <desc id="dg-76-satisfaction-6a-6b-d">One rule sits at the top and two paths lead out of it, side by side and drawn at the same size. On the left is question 6a, the implementation claim, which answers how the rule is satisfied. It lives in the system security plan and runs implemented-requirement, then statement, then by-component. It is narrative, it is standing design intent, it is asserted by the system owner, it is expressed per component, and it fails when the narrative is vague. On the right is question 6b, the assessment result, which answers whether the rule was satisfied, when, and on what. It lives in assessment results and runs observation, then finding, then objective-status. It is evidenced, it is a point in time, it is asserted by the assessor, it is expressed per subject of several types, and it fails when the evidence is stale or the subject is wrong. A table beneath the figure sets out those six differences in full. A rule carrying desired state has a binary satisfaction condition, while the implementation statement expects a narrative one, and conflating the two is the modelling error the figure exists to mark. Both can be populated from one rule without contradiction, and an approach that populates only one is not wrong; it is unfinished in a nameable place.</desc>
