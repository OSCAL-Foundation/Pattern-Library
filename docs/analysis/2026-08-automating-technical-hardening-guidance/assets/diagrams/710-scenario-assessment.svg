<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 994" id="dg-710-scenario-assessment" class="tfg-diagram" role="img" aria-labelledby="dg-710-scenario-assessment-t dg-710-scenario-assessment-d" preserveAspectRatio="xMidYMid meet">
  <title id="dg-710-scenario-assessment-t">One system, three hardening guides: the file set for the assessment first approach</title>
  <desc id="dg-710-scenario-assessment-d">A count of the OSCAL files this approach needs for the scenario, drawn as one tile per file. 11 files in total, across 5 of the seven models. 1 catalog file, the framework only, named NIST 800-53. 1 profile file, the High baseline, named 800-53 High. 0 mapping-collection files, none, framework mappings are on activities. 0 component-definition files, none, engines are identified in each plan. 1 system-security-plan file, one, addressing 370 controls, named System SSP. 4 assessment-plan files, one for the framework assessment, one per guide, named 800-53 AP, CIS Ubuntu AP, DISA PgSQL AP, CISA SCuBA AP. 4 assessment-results files, one per plan; each result references exactly one plan, named 800-53 AR, CIS Ubuntu AR, DISA PgSQL AR, CISA SCuBA AR. A model this approach does not use is drawn hollow and labelled none, so the absence is as visible as the presence. The tile is the same size in all three figures, so the area of ink is the comparison. The system security plan addresses 370 controls; all three guides remain in assessment plans.</desc>
  <style>
  #dg-710-scenario-assessment text { font-family: var(--font-sans); fill: var(--text); }
