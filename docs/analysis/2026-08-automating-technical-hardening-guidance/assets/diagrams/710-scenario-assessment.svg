  #dg-710-scenario-assessment .tk { font-size: 16px; fill: var(--text-muted);
                font-style: italic; }
  #dg-710-scenario-assessment .band { fill: var(--bg-subtle); stroke: none; }
  #dg-710-scenario-assessment .plate { fill: var(--bg); stroke: none; }
  #dg-710-scenario-assessment .model { fill: var(--bg); stroke: var(--border-strong); stroke-width: 1.6; }
  #dg-710-scenario-assessment .box { fill: var(--bg-subtle); stroke: var(--border-strong); stroke-width: 1.6; }
  #dg-710-scenario-assessment .hollow { fill: none; stroke: var(--empty-line); stroke-width: 1.8; }
  #dg-710-scenario-assessment .ref { fill: none; stroke: var(--text); stroke-width: 1.8; }
  #dg-710-scenario-assessment .join { fill: none; stroke: var(--text-muted); stroke-width: 1.6; }
  #dg-710-scenario-assessment .weak { fill: none; stroke: var(--text-faint); stroke-width: 1.6;
                  stroke-dasharray: 2 4; }
  #dg-710-scenario-assessment .contain { fill: none; stroke: var(--border-strong); stroke-width: 1.4; }
  #dg-710-scenario-assessment .mk-ref { fill: var(--text); stroke: none; }
  #dg-710-scenario-assessment .mk-join { fill: var(--text-muted); stroke: none; }
  #dg-710-scenario-assessment .mk-weak { fill: var(--text-faint); stroke: none; }
