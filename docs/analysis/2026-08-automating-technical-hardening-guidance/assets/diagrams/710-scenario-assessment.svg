  #dg-710-scenario-assessment .key { fill: none; stroke: var(--text); stroke-width: 1.6; }
  #dg-710-scenario-assessment .cutmark { stroke: var(--text); stroke-width: 2.4; fill: none; }
  #dg-710-scenario-assessment .rt-l { fill: none; stroke: var(--text-muted); stroke-width: 1.6; }
  #dg-710-scenario-assessment .rt-f { fill: var(--text-muted); stroke: none; }
  #dg-710-scenario-assessment .mi { stroke: var(--mi-ink); color: var(--mi-ink); }
  #dg-710-scenario-assessment .mi__soft { stroke: var(--mi-soft); }
  #dg-710-scenario-assessment .mi__knock { fill: var(--mi-chip); stroke: var(--mi-soft); }
  #dg-710-scenario-assessment .mi--control { --mi-ink: var(--layer-control-ink);
                         --mi-soft: var(--layer-control-soft);
                         --mi-chip: var(--layer-control-bg); }
  #dg-710-scenario-assessment .mi--impl { --mi-ink: var(--layer-impl-ink);
                      --mi-soft: var(--layer-impl-soft);
                      --mi-chip: var(--layer-impl-bg); }
  #dg-710-scenario-assessment .mi--assess { --mi-ink: var(--layer-assess-ink);
                        --mi-soft: var(--layer-assess-soft);
                        --mi-chip: var(--layer-assess-bg); }
  </style>
  <defs><marker id="dg-710-scenario-assessment-ref" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 z" class="mk-ref"/></marker><marker id="dg-710-scenario-assessment-join" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 z" class="mk-join"/></marker><marker id="dg-710-scenario-assessment-weak" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 z" class="mk-weak"/></marker></defs>
