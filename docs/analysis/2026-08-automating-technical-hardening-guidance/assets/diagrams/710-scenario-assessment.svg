  #dg-710-scenario-assessment .n { font-size: 17px; font-weight: 620; }
  #dg-710-scenario-assessment .s { font-size: 16px; }
  #dg-710-scenario-assessment .m { font-size: 16px; font-family: var(--font-mono); }
