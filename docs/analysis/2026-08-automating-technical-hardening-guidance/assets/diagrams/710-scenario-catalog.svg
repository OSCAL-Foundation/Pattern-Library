<text x="24" y="34" class="h">18 files, across all seven models</text>
<text x="24" y="60" class="s mu">Each guide is published as a catalog, selected by a profile of its own, and tied back to the framework</text>
<text x="24" y="82" class="s mu">by a mapping collection. The plan of record answers every control in the merged set.</text>
