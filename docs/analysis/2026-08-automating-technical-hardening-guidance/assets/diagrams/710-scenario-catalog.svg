<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1074" id="dg-710-scenario-catalog" class="tfg-diagram" role="img" aria-labelledby="dg-710-scenario-catalog-t dg-710-scenario-catalog-d" preserveAspectRatio="xMidYMid meet">
  <title id="dg-710-scenario-catalog-t">One system, three hardening guides: the file set for the catalog first approach</title>
  <desc id="dg-710-scenario-catalog-d">A count of the OSCAL files this approach needs for the scenario, drawn as one tile per file. 18 files in total, across all seven models. 4 catalog files, one for the framework, one for each guide, named NIST 800-53, CIS Ubuntu, DISA PgSQL, CISA SCuBA. 5 profile files, one selection per catalog, and one to merge them, named 800-53 High, CIS Ubuntu, DISA PgSQL, CISA SCuBA, Org merged. 3 mapping-collection files, one per guide, tying its controls to the framework, named CIS to 800-53, STIG to 800-53, SCuBA to 800-53. 3 component-definition files, one per technology, carrying the check components, named Ubuntu checks (software), PgSQL checks (software), M365 checks (software). 1 system-security-plan file, one, answering 917 controls, named System SSP. 1 assessment-plan file, one, named System AP. 1 assessment-results file, one, named System AR. A model this approach does not use is drawn hollow and labelled none, so the absence is as visible as the presence. The tile is the same size in all three figures, so the area of ink is the comparison. The plan of record answers 917 controls, 370 from the framework and 547 from the guides.</desc>
