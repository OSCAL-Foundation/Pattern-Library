  #dg-710-scenario-component .cutmark { stroke: var(--text); stroke-width: 2.4; fill: none; }
  #dg-710-scenario-component .rt-l { fill: none; stroke: var(--text-muted); stroke-width: 1.6; }
  #dg-710-scenario-component .rt-f { fill: var(--text-muted); stroke: none; }
  #dg-710-scenario-component .mi { stroke: var(--mi-ink); color: var(--mi-ink); }
  #dg-710-scenario-component .mi__soft { stroke: var(--mi-soft); }
  #dg-710-scenario-component .mi__knock { fill: var(--mi-chip); stroke: var(--mi-soft); }
  #dg-710-scenario-component .mi--control { --mi-ink: var(--layer-control-ink);
                         --mi-soft: var(--layer-control-soft);
                         --mi-chip: var(--layer-control-bg); }
