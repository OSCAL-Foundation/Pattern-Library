<text x="24" y="34" class="h">11 files, across 6 of the seven models</text>
<text x="24" y="60" class="s mu">Each guide becomes rules on the component being configured. Each checking engine becomes a separate</text>
<text x="24" y="82" class="s mu">validation component. The framework catalog and baseline profile remain unchanged.</text>
