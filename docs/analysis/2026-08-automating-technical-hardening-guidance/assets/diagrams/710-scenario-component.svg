<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1020" id="dg-710-scenario-component" class="tfg-diagram" role="img" aria-labelledby="dg-710-scenario-component-t dg-710-scenario-component-d" preserveAspectRatio="xMidYMid meet">
  <title id="dg-710-scenario-component-t">One system, three hardening guides: the file set for the component first approach</title>
  <desc id="dg-710-scenario-component-d">A count of the OSCAL files this approach needs for the scenario, drawn as one tile per file. 11 files in total, across 6 of the seven models. 1 catalog file, the framework only, named NIST 800-53. 1 profile file, the High baseline, named 800-53 High. 0 mapping-collection files, none, framework mappings are inside component definitions. 6 component-definition files, three products with 547 rules, three engines with checks, named Ubuntu (software), PostgreSQL (software), Microsoft 365 (software), Ubuntu checks (validation), PgSQL checks (validation), M365 checks (validation). 1 system-security-plan file, one, addressing 370 controls and containing 547 rules, named System SSP. 1 assessment-plan file, one, named System AP. 1 assessment-results file, one, named System AR. A model this approach does not use is drawn hollow and labelled none, so the absence is as visible as the presence. The tile is the same size in all three figures, so the area of ink is the comparison. The system security plan addresses 370 controls and contains 547 desired-state rules in components.</desc>
