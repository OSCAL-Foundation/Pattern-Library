  #dg-75-stakeholders .join { fill: none; stroke: var(--text-muted); stroke-width: 1.6; }
  #dg-75-stakeholders .weak { fill: none; stroke: var(--text-faint); stroke-width: 1.6;
                  stroke-dasharray: 2 4; }
  #dg-75-stakeholders .contain { fill: none; stroke: var(--border-strong); stroke-width: 1.4; }
  #dg-75-stakeholders .mk-ref { fill: var(--text); stroke: none; }
  #dg-75-stakeholders .mk-join { fill: var(--text-muted); stroke: none; }
  #dg-75-stakeholders .mk-weak { fill: var(--text-faint); stroke: none; }
