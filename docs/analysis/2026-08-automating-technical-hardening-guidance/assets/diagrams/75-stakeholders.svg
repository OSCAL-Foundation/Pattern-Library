  #dg-75-stakeholders .box { fill: var(--bg-subtle); stroke: var(--border-strong); stroke-width: 1.6; }
  #dg-75-stakeholders .hollow { fill: none; stroke: var(--empty-line); stroke-width: 1.8; }
