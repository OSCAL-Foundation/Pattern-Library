<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" id="dg-75-stakeholders" class="tfg-diagram" role="img" aria-labelledby="dg-75-stakeholders-t dg-75-stakeholders-d" preserveAspectRatio="xMidYMid meet">
  <title id="dg-75-stakeholders-t">One recommendation, three stakeholders, three paths</title>
  <desc id="dg-75-stakeholders-d">One recommendation sits on the left. Three paths lead out of it, one for each stakeholder, and the three are drawn at the same size and weight because none is ranked above another. The publisher's path runs from a recommendation written once to a versioned, tailorable, citable publication. The implementer's path runs from desired state to a configuration engine to applied state. The assessor's path runs from a check to execution or examination to evidence to a finding. This is an organizing structure, not a thesis: all three needs are real and can be true at once, and the site's question is which questions each approach answers, for which stakeholder, and what it costs to fill the rest. No approach is marked on this drawing.</desc>
