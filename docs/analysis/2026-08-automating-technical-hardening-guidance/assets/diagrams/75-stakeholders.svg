  #dg-75-stakeholders .rt-f { fill: var(--text-muted); stroke: none; }
  #dg-75-stakeholders .mi { stroke: var(--mi-ink); color: var(--mi-ink); }
  #dg-75-stakeholders .mi__soft { stroke: var(--mi-soft); }
  #dg-75-stakeholders .mi__knock { fill: var(--mi-chip); stroke: var(--mi-soft); }
  #dg-75-stakeholders .mi--control { --mi-ink: var(--layer-control-ink);
                         --mi-soft: var(--layer-control-soft);
                         --mi-chip: var(--layer-control-bg); }
  #dg-75-stakeholders .mi--impl { --mi-ink: var(--layer-impl-ink);
                      --mi-soft: var(--layer-impl-soft);
                      --mi-chip: var(--layer-impl-bg); }
  #dg-75-stakeholders .mi--assess { --mi-ink: var(--layer-assess-ink);
                        --mi-soft: var(--layer-assess-soft);
                        --mi-chip: var(--layer-assess-bg); }
  </style>
  <defs><marker id="dg-75-stakeholders-ref" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 z" class="mk-ref"/></marker><marker id="dg-75-stakeholders-join" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 z" class="mk-join"/></marker><marker id="dg-75-stakeholders-weak" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 z" class="mk-weak"/></marker></defs>
