  #dg-75-stakeholders .mu { fill: var(--text-muted); }
  #dg-75-stakeholders .fa { fill: var(--text-faint); }
  #dg-75-stakeholders .tl { font-size: 16px; font-family: var(--font-mono); }
  #dg-75-stakeholders .tk { font-size: 16px; fill: var(--text-muted);
                font-style: italic; }
