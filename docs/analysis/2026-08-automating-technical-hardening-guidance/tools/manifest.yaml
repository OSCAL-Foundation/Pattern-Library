# Snippet manifest: the declarative source of truth for 32 OSCAL JSON snippets.
#
# Every pointer below was resolved against the corpora on 2026-08-12 and is
# asserted by tools/verify.py. Nothing on the site is hand-typed.
#
# Fields
#   id         kebab-case, unique, stable. Used as the HTML anchor.
#   slot       1 | 2 | 3 | 4 | 5 | 6a | 6b | meta
#   approach   assessment-first | catalog-first | component-first | schema
#   title      short human label shown in the block header
#   source     path relative to the corpora root
#   pointer    RFC 6901 JSON pointer, or "$" for the whole document
#   language   json (default for every entry)
#   trim       optional. RFC 6901 pointers, relative to the extracted node,
#              whose values are replaced by the string "..."
#   max_prose  optional int. Any string value longer than this is cut and
#              suffixed with " [truncated]". Never silent.

# Where the corpora are read from. Relative to this file's directory.
#
# TFG_CORPORA overrides it and is how this is normally set: the site sits under
# docs/analysis/ in a repository the corpora are not a sibling of, so the path
# below only resolves in the standalone layout the site was built in.
corpora_root: "../../tfg-automated-assessments"

